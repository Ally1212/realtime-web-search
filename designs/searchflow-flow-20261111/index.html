<title id="title">三个系统怎样串起来：SearchFlow采集与Whale上传流程</title><desc id="desc">网站发指令给采集后台，后台从Google读取搜索结果并存入自己的数据库。上传是另一条可选流程，后台把样本交给Whale接收队列，平台内部持久化后才能由读取接口验证。本轮两个样本接收成功，最终入库未确认，读回未找到。</desc>

<text x="64" y="65" font-size="16" font-weight="700" letter-spacing="2" class="blue">SEARCHFLOW · 实际流程说明</text>
<text x="64" y="116" font-size="38" font-weight="750">3 套系统，分两步：先采集，再选择是否上传</text>
<text x="64" y="154" class="body muted">网站能看到数据，说明已保存在采集后台；不代表 Whale 已经收到或入库。</text>

<text x="106" y="480" class="label">你看到的 SearchFlow</text><text x="106" y="514" class="small muted">页面向后台取数据</text><text x="106" y="542" class="small muted">不必先从 Whale 读取</text>
<text x="88" y="704" class="small muted">网站 = 遥控器 + 展示屏</text>

<text x="457" y="480" class="head">自己的数据库</text><text x="457" y="516" class="body">保存标题、摘要、链接、采集时间</text><text x="457" y="544" class="small muted">昨晚新增 1,385 个历史去重 URL</text>
