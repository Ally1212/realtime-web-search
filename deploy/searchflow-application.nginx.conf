events { worker_connections 256; }
http {
 access_log /dev/stdout;
 error_log /dev/stderr warn;
 # The shared HTTPS proxy appends the actual client address to this header.
 map $http_x_forwarded_for $access_client_ip {
  default $remote_addr;
  ~(?<access_last_ip>[^,\ ]+)$ $access_last_ip;
 }
 server {
  listen 8093;
  server_name _;
  return 301 https://searchflow.20-150-145-162.sslip.io$request_uri;
 }
 server {
  listen 172.18.0.1:18094;
  server_name searchflow.20-150-145-162.sslip.io;
  allow 172.18.0.0/16;
  deny all;
  client_max_body_size 1m;
  add_header Cache-Control "no-store" always;
  add_header X-Frame-Options DENY always;
  location = /_access/check {
   internal;
   proxy_pass http://127.0.0.1:18095/check;
   proxy_pass_request_body off;
   proxy_set_header Content-Length "";
   proxy_set_header Cookie $http_cookie;
   proxy_set_header X-SearchFlow-Access-Key $http_x_searchflow_access_key;
  }
  location = /_access/login {
   client_max_body_size 2k;
   proxy_pass http://127.0.0.1:18095;
   proxy_set_header X-Real-IP $access_client_ip;
  }
  location = /_access/logout {
   proxy_pass http://127.0.0.1:18095;
  }
  location @access_denied {
   proxy_method GET;
   proxy_pass_request_body off;
   proxy_set_header Content-Length "";
   rewrite ^ /denied break;
   proxy_pass http://127.0.0.1:18095;
  }

  location = /v1/google {
   auth_request /_access/check;
   error_page 401 = @access_denied;
   proxy_pass http://10.0.0.11:18097;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-SearchFlow-Access-Key "";
   proxy_read_timeout 300s;
   proxy_buffering off;
  }
  location ^~ /v1/google/ {
   auth_request /_access/check;
   error_page 401 = @access_denied;
   proxy_pass http://10.0.0.11:18097;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-SearchFlow-Access-Key "";
   proxy_read_timeout 300s;
   proxy_buffering off;
  }
  location = / {
   auth_request /_access/check;
   error_page 401 = @access_denied;
   root /srv/searchflow;
   default_type text/html;
   try_files /index.html =404;
  }
  location = /stats {
   auth_request /_access/check;
   error_page 401 = @access_denied;
   root /srv/searchflow;
   default_type text/html;
   try_files /stats.html =404;
  }
  location = /stats/legacy {
   auth_request /_access/check;
   error_page 401 = @access_denied;
   root /srv/searchflow;
   default_type text/html;
   try_files /legacy.html =404;
  }
  location = /articles {
   auth_request /_access/check;
   error_page 401 = @access_denied;
   root /srv/searchflow;
   default_type text/html;
   try_files /articles.html =404;
  }
  location / {
   auth_request /_access/check;
   error_page 401 = @access_denied;
   proxy_pass http://10.0.0.11:18097;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-SearchFlow-Access-Key "";
   proxy_read_timeout 300s;
   proxy_buffering off;
  }
 }
}
