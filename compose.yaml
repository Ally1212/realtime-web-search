services:
  searxng:
    image: docker.io/searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8080/healthz' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  rsshub:
    image: docker.io/diygod/rsshub:latest
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1200/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: realtime
      POSTGRES_USER: realtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realtime-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtime -d realtime"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      SEARXNG_URL: http://searxng:8080
      OPENSEARCH_INDEX: realtime-pages-v3
      DATABASE_URL: postgresql://realtime:${POSTGRES_PASSWORD:-realtime-local}@postgres:5432/realtime
      VALKEY_URL: redis://valkey:6379/0
      PROXY_API_BASE: https://proxyapi.pekpik.com
      PRIVATE_READER_API_KEY: ${PRIVATE_READER_API_KEY:-}
      SHARED_PROXY_USERNAME: ${SHARED_PROXY_USERNAME:-}
      SHARED_PROXY_PASSWORD: ${SHARED_PROXY_PASSWORD:-}
      PROXY_STICKY_SECONDS: ${PROXY_STICKY_SECONDS:-300}
      PROXY_SELECTION_WINDOW: ${PROXY_SELECTION_WINDOW:-20}
      PROXY_SORT: ${PROXY_SORT:-quality}
      DEFAULT_PROXY_PROFILE: ${DEFAULT_PROXY_PROFILE:-private}
      ROBOTS_BYPASS_DOMAINS: ${ROBOTS_BYPASS_DOMAINS:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8091"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./state:/app/state
    depends_on:
      opensearch:
        condition: service_healthy
      searxng:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  crawler:
    build: .
    command: ["worker"]
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: realtime-pages-v3
      SEARXNG_URL: http://searxng:8080
      DATABASE_URL: postgresql://realtime:${POSTGRES_PASSWORD:-realtime-local}@postgres:5432/realtime
      VALKEY_URL: redis://valkey:6379/0
      PROXY_API_BASE: https://proxyapi.pekpik.com
      PRIVATE_READER_API_KEY: ${PRIVATE_READER_API_KEY:-}
      SHARED_PROXY_USERNAME: ${SHARED_PROXY_USERNAME:-}
      SHARED_PROXY_PASSWORD: ${SHARED_PROXY_PASSWORD:-}
      DEFAULT_PROXY_PROFILE: ${DEFAULT_PROXY_PROFILE:-private}
      PROXY_CACHE_DIR: /app/state/proxies
      PROXY_STICKY_SECONDS: ${PROXY_STICKY_SECONDS:-300}
      PROXY_SELECTION_WINDOW: ${PROXY_SELECTION_WINDOW:-20}
      PROXY_SORT: ${PROXY_SORT:-quality}
      ROBOTS_BYPASS_DOMAINS: ${ROBOTS_BYPASS_DOMAINS:-}
      CRAWLER_SLOTS: ${CRAWLER_SLOTS:-2}
      CRAWLER_CONCURRENCY: ${CRAWLER_CONCURRENCY:-32}
      CRAWLER_CONCURRENCY_PER_DOMAIN: ${CRAWLER_CONCURRENCY_PER_DOMAIN:-4}
      CRAWLER_DOWNLOAD_DELAY: ${CRAWLER_DOWNLOAD_DELAY:-0.1}
      CRAWLER_AUTOTHROTTLE_TARGET: ${CRAWLER_AUTOTHROTTLE_TARGET:-3}
      CRAWLER_DEPTH_LIMIT: ${CRAWLER_DEPTH_LIMIT:-12}
      DISCOVERY_PAGES: ${DISCOVERY_PAGES:-10}
      MAX_LINKS_PER_PAGE: ${MAX_LINKS_PER_PAGE:-100}
      DISCOVERY_FEEDS_JSON: ${DISCOVERY_FEEDS_JSON:-}
      TRAFILATURA_ENABLED: ${TRAFILATURA_ENABLED:-true}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./state:/app/state
    depends_on:
      opensearch:
        condition: service_healthy
      searxng:
        condition: service_healthy
      rsshub:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opensearch-data:
  postgres-data:
  valkey-data:
