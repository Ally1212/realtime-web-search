use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - duckduckgo
      - google
      - marginalia
      - mojeek
      - qwant
      - startpage
      - wikidata
      - wikipedia
      - yahoo
      - yep

general:
  debug: false
  instance_name: "Local Live Search Discovery"

search:
  safe_search: 1
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 300
    SearxEngineTooManyRequests: 300

server:
  secret_key: "local-realtime-search-not-public"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 12.0
  max_request_timeout: 18.0
