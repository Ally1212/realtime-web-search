server:
  host: 0.0.0.0
  port: 7000
  debug: false
  verbose: false
  quiet: false
  raw_requests: false
  insecure: false

app:
  timeout: 15
  log_format: json
  head: false
  leakless: false
  leave_head: false
  block_resources: image,font,css,media
  block_trackers: true
  max_processes: 12
  idle_ttl: 5m

extract:
  enabled: false

proxies:
  allow_request_proxy_url: true
  health:
    failure_threshold: 2
  lanes:
    enabled: true
    max_lanes: 160
    drop_cookies_on_challenge: true

cache:
  ttl_seconds: 0
  max_size: 1

resilience:
  max_retries: 0
  allow_endpoint_fallback: false

circuit_breaker:
  # The application owns cross-proxy cooling and circuit state. Keep this only
  # as a last-resort guard so a few bad exits cannot disable every search.
  failures: 1000
  recovery_seconds: 60
  successes: 2

cors:
  enabled: false

captcha:
  solver_enabled: false

google:
  rate_requests: 120
  rate_seconds: 60
  rate_burst: 2
