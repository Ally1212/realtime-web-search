[project]
name = "realtime-web-search"
version = "0.2.0"
description = "Live search discovery and real-time web crawler"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "psycopg[binary]>=3.3,<4",
  "redis>=7,<9",
  "requests>=2.32,<3",
  "requests[socks]>=2.32,<3",
  "scrapy>=2.18,<3",
  "scrapy-curl-cffi>=0.3,<1",
  "trafilatura>=2.2,<3",
]

[project.scripts]
realtime-web-search = "realtime.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["realtime*"]
